<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>התחברות - סרקו QR</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✡</text></svg>">
  <style>
    .connect-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a1020 0%, var(--navy) 50%, #0a1020 100%);
      padding: 20px;
    }

    /* Intro slide */
    .intro-slide {
      max-width: 400px;
      width: 100%;
      text-align: center;
      padding: 20px;
    }

    .tv-illustration {
      background: #fff;
      border-radius: 12px;
      padding: 24px 40px;
      margin: 0 auto 24px;
      display: inline-block;
    }

    .tv-illustration .tv-text {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0c1425;
      font-family: 'Assistant', sans-serif;
    }

    .tv-border {
      border: 4px solid #333;
      border-radius: 16px;
      padding: 20px;
      margin: 0 auto 8px;
      max-width: 260px;
      background: #fff;
    }

    .steps-list {
      text-align: right;
      margin: 24px 0;
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .step-number {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gold);
      color: #0c1425;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .intro-btn {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      font-size: 1.2rem;
    }

    /* Scanner view */
    .scanner-view {
      display: none;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .scanner-title {
      color: var(--gold-light);
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .scanner-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    #qr-reader {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
    }

    #qr-reader video {
      border-radius: 16px;
    }

    .scanner-tip {
      background: rgba(184,149,62,0.1);
      border: 1px solid rgba(184,149,62,0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 16px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .scanner-tip .tip-icon {
      color: var(--gold);
      margin-left: 6px;
    }

    /* Manual code input */
    .manual-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .manual-section p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 10px;
    }

    .manual-row {
      display: flex;
      gap: 8px;
    }

    .manual-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      font-family: 'Assistant', sans-serif;
      font-size: 1.1rem;
      background: rgba(255,255,255,0.08);
      color: #fff;
      text-align: center;
      direction: ltr;
      letter-spacing: 3px;
    }

    .manual-input::placeholder {
      color: rgba(255,255,255,0.3);
      letter-spacing: 0;
    }

    .manual-input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .manual-btn {
      padding: 12px 20px;
      background: var(--gold);
      color: #0c1425;
      border: none;
      border-radius: 8px;
      font-family: 'Assistant', sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    .scanner-error {
      color: #e55;
      font-size: 0.9rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="connect-page">

    <!-- INTRO SLIDE -->
    <div class="intro-slide" id="intro-slide">
      <div class="tv-border">
        <div class="tv-illustration">
          <div class="tv-text">hchc.co.il</div>
        </div>
      </div>

      <div class="steps-list">
        <div class="step-item">
          <span class="step-number">1</span>
          <span>כנסו לדפדפן במסך הטלוויזיה ורשמו בשורת הכתובת את שם האתר: <strong style="color:var(--gold-light)">hchc.co.il</strong></span>
        </div>
        <div class="step-item">
          <span class="step-number">2</span>
          <span>סרקו את הקוד באמצעות מצלמת הטלפון</span>
        </div>
      </div>

      <button class="btn btn-primary intro-btn" id="start-scan-btn">הבנתי</button>
    </div>

    <!-- SCANNER VIEW -->
    <div class="scanner-view" id="scanner-view">
      <div id="close-scanner" style="position:absolute; top:16px; left:16px; color:var(--text-muted); font-size:1.5rem; cursor:pointer; z-index:10;">✕</div>

      <p class="scanner-title">סרקו את קוד ה-QR</p>
      <p class="scanner-subtitle">כוונו את הטלפון לקוד עד שהוא ממלא את המסגרת</p>

      <div id="qr-reader"></div>

      <div class="scanner-tip">
        <span class="tip-icon">💡</span> טיפ: החזיקו את הטלפון יציב וקרוב לקוד
      </div>

      <div class="manual-section">
        <p>או הזינו קוד אירוע ידנית:</p>
        <div class="manual-row">
          <input type="text" class="manual-input" id="manual-code" placeholder="קוד אירוע" maxlength="6">
          <button class="manual-btn" id="manual-go">כניסה</button>
        </div>
        <p class="scanner-error" id="scanner-error">קוד לא תקין או אירוע לא נמצא</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/storage.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="/js/accessibility.js"></script>
  <script>
    var introSlide = document.getElementById('intro-slide');
    var scannerView = document.getElementById('scanner-view');
    var html5QrCode = null;

    // Start scanning
    document.getElementById('start-scan-btn').addEventListener('click', function() {
      introSlide.style.display = 'none';
      scannerView.style.display = 'block';
      startScanner();
    });

    // Close scanner
    document.getElementById('close-scanner').addEventListener('click', function() {
      stopScanner();
      scannerView.style.display = 'none';
      introSlide.style.display = 'block';
    });

    function startScanner() {
      html5QrCode = new Html5Qrcode('qr-reader');

      html5QrCode.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
          aspectRatio: 1
        },
        onScanSuccess,
        function() {} // ignore scan failures
      ).catch(function(err) {
        console.error('Camera error:', err);
        document.getElementById('scanner-error').textContent = 'לא ניתן לפתוח את המצלמה. נסו להזין קוד ידנית.';
        document.getElementById('scanner-error').style.display = 'block';
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().catch(function() {});
      }
    }

    function onScanSuccess(decodedText) {
      stopScanner();

      // Check if it's a URL with /e/ pattern
      var match = decodedText.match(/\/e\/([a-z0-9]+)/);
      if (match) {
        window.location.href = '/e/' + match[1];
        return;
      }

      // If it's a full URL, just navigate to it
      if (decodedText.startsWith('http')) {
        window.location.href = decodedText;
        return;
      }

      // Try as event code
      navigateToEvent(decodedText);
    }

    // Manual code entry
    document.getElementById('manual-go').addEventListener('click', function() {
      var code = document.getElementById('manual-code').value.trim().toLowerCase();
      if (!code || code.length < 4) {
        document.getElementById('scanner-error').textContent = 'נא להזין קוד תקין';
        document.getElementById('scanner-error').style.display = 'block';
        return;
      }
      navigateToEvent(code);
    });

    document.getElementById('manual-code').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('manual-go').click();
      }
    });

    function navigateToEvent(code) {
      // Verify event exists
      getEventMeta(code).then(function(meta) {
        if (meta) {
          window.location.href = '/e/' + code;
        } else {
          document.getElementById('scanner-error').textContent = 'אירוע לא נמצא. בדקו את הקוד.';
          document.getElementById('scanner-error').style.display = 'block';
        }
      });
    }

    // Clear error on input
    document.getElementById('manual-code').addEventListener('input', function() {
      document.getElementById('scanner-error').style.display = 'none';
    });
  </script>
</body>
</html>
