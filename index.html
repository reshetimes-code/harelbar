<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>מערכת ברכות</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✡</text></svg>">
  <style>
    .page-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #0a1020 0%, var(--navy) 50%, #0a1020 100%);
      padding: 20px;
    }

    .top-buttons {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }

    .top-btn {
      padding: 6px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: rgba(255,255,255,0.4);
      font-size: 0.7rem;
      text-decoration: none;
      font-family: Assistant, sans-serif;
      cursor: pointer;
    }

    .top-btn:hover {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.1);
    }

    /* ===== QR VIEW (desktop/TV) ===== */
    .qr-view {
      display: none;
      text-align: center;
      width: 100%;
    }

    .qr-view h1 {
      font-family: 'Assistant', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .qr-view .subtitle {
      font-size: 1.3rem;
      color: var(--text-secondary);
      margin-bottom: 40px;
    }

    .qr-wrapper {
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      display: inline-block;
      box-shadow: 0 8px 40px rgba(184,149,62,0.15);
    }

    .qr-wrapper img {
      width: 350px;
      height: 350px;
    }

    .qr-url {
      margin-top: 20px;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--gold-light);
    }

    .qr-hint {
      margin-top: 12px;
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* ===== MOBILE VIEW ===== */
    .mobile-card {
      display: none;
      max-width: 420px;
      width: 100%;
      text-align: center;
      padding: 48px 32px;
    }

    .mobile-icon {
      font-size: 3rem;
      color: var(--gold);
      opacity: 0.8;
      margin-bottom: 24px;
      display: block;
    }

    .mobile-title {
      font-family: 'Assistant', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 8px;
    }

    .mobile-subtitle {
      font-size: 1.05rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .mobile-divider {
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 28px;
      opacity: 0.4;
    }

    .mobile-btn {
      display: block;
      width: 100%;
      padding: 18px;
      font-size: 1.3rem;
      text-align: center;
      text-decoration: none;
    }

    .mobile-hint {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- Top buttons - always visible -->
  <div class="top-buttons">
    <button class="top-btn" id="fullscreen-btn">⛶ מסך מלא</button>
    <button class="top-btn" id="screen-btn">🖥 מסך</button>
    <a href="admin.html" class="top-btn" style="text-decoration:none;">⚙ פנל ניהול</a>
  </div>

  <div class="page-bg">

    <!-- ===== QR VIEW (shown on non-mobile) ===== -->
    <div class="qr-view" id="qr-view">
      <h1>מערכת ברכות</h1>
      <p class="subtitle">סרקו את הקוד מהטלפון כדי להתחיל</p>
      <div class="qr-wrapper">
        <img id="qr-img" alt="QR Code">
      </div>
      <p class="qr-url">hchc.co.il</p>
      <p class="qr-hint">או הכניסו את הכתובת בדפדפן הטלפון</p>

      <div class="mobile-divider" style="margin-top:32px;"></div>
      <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:16px;">או המשיכו כאן במחשב:</p>
      <a href="register.html" class="btn btn-primary mobile-btn new-event-btn" style="max-width:320px; margin:0 auto; display:block;">
        ✍️ פתח אירוע חדש
      </a>
      <button class="existing-account-btn" style="display:block; max-width:320px; width:100%; margin:16px auto 0; padding:14px; background:rgba(184,149,62,0.15); border:1.5px solid var(--gold); border-radius:var(--radius-sm); color:var(--gold-light); font-family:Assistant,sans-serif; font-size:1.05rem; font-weight:700; cursor:pointer; transition:all 0.2s;">
        🔑 יש לי כבר חשבון
      </button>
    </div>

    <!-- ===== MOBILE VIEW ===== -->
    <div class="mobile-card" id="mobile-view">
      <span class="mobile-icon">✡</span>
      <h1 class="mobile-title">מערכת ברכות</h1>
      <p class="mobile-subtitle">לחצו כדי להתחבר לאירוע</p>
      <div class="mobile-divider"></div>

      <a href="register.html" class="btn btn-primary mobile-btn new-event-btn">
        ✍️ פתח אירוע חדש
      </a>

      <button class="existing-account-btn" style="display:block; width:100%; margin-top:16px; padding:14px; background:rgba(184,149,62,0.15); border:1.5px solid var(--gold); border-radius:var(--radius-sm); color:var(--gold-light); font-family:Assistant,sans-serif; font-size:1.05rem; font-weight:700; cursor:pointer; transition:all 0.2s;">
        🔑 יש לי כבר חשבון
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/accessibility.js"></script>
  <script>
    var isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    if (isMobile) {
      document.getElementById('mobile-view').style.display = 'block';
    } else {
      document.getElementById('qr-view').style.display = 'block';
      document.getElementById('qr-img').src = 'https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=' + encodeURIComponent('https://hchc.co.il');

      // Listen for NEW events created after page load (uses the lightweight
      // public eventIndex, which holds no personal data - not the full events tree)
      var existingEvents = {};
      db.ref('eventIndex').once('value', function(snap) {
        var data = snap.val();
        if (data) Object.keys(data).forEach(function(k) { existingEvents[k] = true; });
        db.ref('eventIndex').on('child_added', function(childSnap) {
          if (!existingEvents[childSnap.key]) {
            window.location.href = 'screen.html?event=' + childSnap.key;
          }
        });
      });
    }

    // Screen button with password
    function showPasswordDialog(title, onSuccess) {
      Swal.fire({
        html: '<div dir="rtl" style="text-align:center;">' +
          '<h2 style="color:#fff; font-family:Assistant,sans-serif; font-weight:800; font-size:1.5rem; margin:0 0 16px;">' + title + '</h2>' +
          '<input type="password" id="swal-pwd" placeholder="סיסמה" style="width:100%; padding:14px; border:1.5px solid rgba(255,255,255,0.15); border-radius:8px; font-family:Assistant,sans-serif; font-size:1.3rem; background:rgba(255,255,255,0.08); color:#fff; text-align:center; letter-spacing:3px;">' +
          '<p id="swal-pwd-error" style="color:#e55; font-size:0.9rem; margin-top:8px; display:none;">סיסמה שגויה</p>' +
          '</div>',
        background: 'linear-gradient(180deg, #0c1425 0%, #111c32 100%)',
        border: '1px solid rgba(255,255,255,0.15)',
        confirmButtonText: 'כניסה',
        confirmButtonColor: '#b8953e',
        showCancelButton: true,
        cancelButtonText: 'ביטול',
        width: 380,
        preConfirm: function() {
          var pwd = document.getElementById('swal-pwd').value.trim();
          if (pwd !== '8773') {
            document.getElementById('swal-pwd-error').style.display = 'block';
            return false;
          }
          return true;
        },
        didOpen: function() {
          document.getElementById('swal-pwd').focus();
        }
      }).then(function(result) {
        if (result.isConfirmed) onSuccess();
      });
    }

    // Existing account button(s) - present in both the mobile view and the
    // desktop QR view, so anyone can log in regardless of device. Covers all
    // three roles (main admin / single-event sub-admin / event manager) -
    // the optional username field is only used for the event-manager login.
    document.querySelectorAll('.existing-account-btn').forEach(function(existBtn) {
      existBtn.addEventListener('click', function() {
        Swal.fire({
          html: '<div dir="rtl" style="text-align:center;">' +
            '<h2 style="color:#fff; font-family:Assistant,sans-serif; font-weight:800; font-size:1.3rem; margin:0 0 16px;">כניסה לחשבון</h2>' +
            '<input type="text" id="swal-login-username" placeholder="אימייל (למנהלי אירועים בלבד)" dir="ltr" style="width:100%; padding:12px; margin-bottom:10px; border:1.5px solid rgba(255,255,255,0.15); border-radius:8px; font-family:Assistant,sans-serif; font-size:1rem; background:rgba(255,255,255,0.08); color:#fff; text-align:center;">' +
            '<input type="password" id="swal-login-password" placeholder="סיסמה" style="width:100%; padding:12px; border:1.5px solid rgba(255,255,255,0.15); border-radius:8px; font-family:Assistant,sans-serif; font-size:1.1rem; background:rgba(255,255,255,0.08); color:#fff; text-align:center;">' +
            '</div>',
          background: 'linear-gradient(180deg, #0c1425 0%, #111c32 100%)',
          border: '1px solid rgba(255,255,255,0.15)',
          confirmButtonText: 'כניסה',
          confirmButtonColor: '#b8953e',
          showCancelButton: true,
          cancelButtonText: 'ביטול',
          width: 380,
          showLoaderOnConfirm: true,
          didOpen: function() {
            document.getElementById('swal-login-password').focus();
          },
          preConfirm: function() {
            var uname = document.getElementById('swal-login-username').value.trim();
            var pwd = document.getElementById('swal-login-password').value.trim();
            if (!pwd) {
              Swal.showValidationMessage('נא להזין סיסמה');
              return false;
            }
            var body = { password: pwd };
            if (uname) body.username = uname;
            return fetch('https://us-central1-harelbar-ca7dd.cloudfunctions.net/subAdminLogin', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            }).then(function(res) {
              return res.json().catch(function() { return {}; });
            }).then(function(data) {
              if (!data || !data.ok) {
                Swal.showValidationMessage('פרטי התחברות שגויים');
                return false;
              }
              data.password = pwd;
              return data;
            }).catch(function() {
              Swal.showValidationMessage('שגיאת תקשורת, נסו שוב');
              return false;
            });
          }
        }).then(function(result) {
          if (!result.isConfirmed || !result.value) return;
          var data = result.value;
          clearRoleSession();
          if (data.role === 'manager') {
            sessionStorage.setItem('manager_auth', 'true');
            sessionStorage.setItem('manager_id', data.managerId);
            sessionStorage.setItem('manager_name', data.name || '');
            sessionStorage.setItem('admin_access_password', data.password);
            window.location.href = 'admin.html';
          } else if (data.isMainAdmin) {
            sessionStorage.setItem('admin_auth', 'true');
            sessionStorage.setItem('admin_access_password', data.password);
            window.location.href = 'admin.html';
          } else if (data.eventId) {
            sessionStorage.setItem('sub_admin_event', data.eventId);
            sessionStorage.setItem('admin_access_password', data.password);
            window.location.href = 'admin.html?event=' + data.eventId;
          }
        });
      });
    });

    // Wipes every role's session flag before a fresh login/signup writes its
    // own, so a stale flag from an earlier session in this same browser tab
    // can never combine with the new login (e.g. showing the super admin's
    // panel to someone who just logged in as an event manager).
    function clearRoleSession() {
      sessionStorage.removeItem('admin_auth');
      sessionStorage.removeItem('sub_admin_event');
      sessionStorage.removeItem('manager_auth');
      sessionStorage.removeItem('manager_id');
      sessionStorage.removeItem('manager_name');
    }

    // "פתח אירוע חדש" - offers a one-off private event (today's register.html
    // flow) or signing up as an event manager (an account that can hold
    // several events, all visible to the super admin under "מנהלי אירועים").
    document.querySelectorAll('.new-event-btn').forEach(function(newEventBtn) {
      newEventBtn.addEventListener('click', function(e) {
        e.preventDefault();
        Swal.fire({
          html: '<div dir="rtl" style="text-align:center;">' +
            '<h2 style="color:#fff; font-family:Assistant,sans-serif; font-weight:800; font-size:1.25rem; margin:0 0 6px;">איזה סוג אירוע?</h2>' +
            '<p style="color:rgba(255,255,255,0.5); font-size:0.88rem; margin:0 0 22px;">בחרו את האפשרות המתאימה לכם</p>' +
            '</div>',
          background: 'linear-gradient(180deg, #0c1425 0%, #111c32 100%)',
          border: '1px solid rgba(255,255,255,0.15)',
          showDenyButton: true,
          confirmButtonText: '🗓️ אירוע פרטי (חד פעמי)',
          confirmButtonColor: '#b8953e',
          denyButtonText: '🧑‍💼 אני מנהל/ת אירועים',
          denyButtonColor: '#25D366',
          showCancelButton: true,
          cancelButtonText: 'ביטול',
          width: 420,
          didOpen: function() {
            var actions = document.querySelector('.swal2-actions');
            if (!actions) return;
            actions.style.flexDirection = 'column';
            actions.style.width = '100%';
            ['.swal2-deny', '.swal2-confirm', '.swal2-cancel'].forEach(function(sel) {
              var btn = document.querySelector(sel);
              if (btn) { btn.style.width = '100%'; btn.style.margin = '4px 0'; }
            });
          }
        }).then(function(result) {
          if (result.isConfirmed) {
            window.location.href = 'register.html';
          } else if (result.isDenied) {
            openManagerSignup();
          }
        });
      });
    });

    function openManagerSignup() {
      Swal.fire({
        html: '<div dir="rtl" style="text-align:right;">' +
          '<h2 style="color:#fff; font-family:Assistant,sans-serif; font-weight:800; font-size:1.2rem; margin:0 0 16px; text-align:center;">הרשמה כמנהל/ת אירועים</h2>' +
          '<label style="color:var(--text-muted); font-size:0.85rem;">שם מלא</label>' +
          '<input type="text" id="swal-signup-name" style="width:100%; padding:12px; margin:4px 0 12px; border:1.5px solid rgba(255,255,255,0.15); border-radius:8px; font-family:Assistant,sans-serif; font-size:1rem; background:rgba(255,255,255,0.08); color:#fff;">' +
          '<label style="color:var(--text-muted); font-size:0.85rem;">אימייל</label>' +
          '<input type="email" id="swal-signup-email" dir="ltr" style="width:100%; padding:12px; margin:4px 0 12px; border:1.5px solid rgba(255,255,255,0.15); border-radius:8px; font-family:Assistant,sans-serif; font-size:1rem; background:rgba(255,255,255,0.08); color:#fff;">' +
          '<label style="color:var(--text-muted); font-size:0.85rem;">סיסמה</label>' +
          '<input type="password" id="swal-signup-password" dir="ltr" style="width:100%; padding:12px; margin:4px 0; border:1.5px solid rgba(255,255,255,0.15); border-radius:8px; font-family:Assistant,sans-serif; font-size:1rem; background:rgba(255,255,255,0.08); color:#fff;">' +
          '</div>',
        background: 'linear-gradient(180deg, #0c1425 0%, #111c32 100%)',
        border: '1px solid rgba(255,255,255,0.15)',
        confirmButtonText: 'הרשמה',
        confirmButtonColor: '#b8953e',
        showCancelButton: true,
        cancelButtonText: 'ביטול',
        width: 380,
        showLoaderOnConfirm: true,
        preConfirm: function() {
          var name = document.getElementById('swal-signup-name').value.trim();
          var email = document.getElementById('swal-signup-email').value.trim();
          var password = document.getElementById('swal-signup-password').value.trim();
          if (!email || !password) {
            Swal.showValidationMessage('נא למלא אימייל וסיסמה');
            return false;
          }
          return fetch('https://us-central1-harelbar-ca7dd.cloudfunctions.net/signupEventManager', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, name: name, password: password })
          }).then(function(res) {
            return res.json().catch(function() { return {}; });
          }).then(function(data) {
            if (!data || !data.ok) {
              var msg = data && data.error === 'email_taken' ? 'האימייל הזה כבר רשום במערכת - נסו "יש לי כבר חשבון"' : 'שגיאה בהרשמה, נסו שוב';
              Swal.showValidationMessage(msg);
              return false;
            }
            data.password = password;
            return data;
          }).catch(function() {
            Swal.showValidationMessage('שגיאת תקשורת, נסו שוב');
            return false;
          });
        }
      }).then(function(result) {
        if (!result.isConfirmed || !result.value) return;
        var data = result.value;
        clearRoleSession();
        sessionStorage.setItem('manager_auth', 'true');
        sessionStorage.setItem('manager_id', data.managerId);
        sessionStorage.setItem('manager_name', data.name || '');
        sessionStorage.setItem('admin_access_password', data.password);
        window.location.href = 'admin.html';
      });
    }

    // Fullscreen toggle (like F11, but works as a button click)
    var fullscreenBtn = document.getElementById('fullscreen-btn');
    if (fullscreenBtn) {
      fullscreenBtn.addEventListener('click', function() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function() {});
        } else {
          document.exitFullscreen();
        }
      });
      document.addEventListener('fullscreenchange', function() {
        fullscreenBtn.textContent = document.fullscreenElement ? '⛶ יציאה ממסך מלא' : '⛶ מסך מלא';
      });
    }

    var screenBtn = document.getElementById('screen-btn');
    if (screenBtn) screenBtn.addEventListener('click', function() {
      showPasswordDialog('כניסה למסך', function() {
        db.ref('eventIndex').limitToLast(1).once('value', function(snapshot) {
          if (snapshot.val()) {
            var eventId = Object.keys(snapshot.val())[0];
            window.location.href = 'screen.html?event=' + eventId;
          } else {
            // No events - show QR and wait
            document.querySelector('.page-bg').innerHTML =
              '<div style="text-align:center;">' +
                '<h1 style="font-family:Assistant,sans-serif; font-size:3rem; font-weight:800; color:var(--gold-light); margin-bottom:8px;">מערכת ברכות</h1>' +
                '<p style="font-size:1.3rem; color:var(--text-secondary); margin-bottom:40px;">סרקו את הקוד מהטלפון כדי להתחיל</p>' +
                '<div style="background:#fff; border-radius:24px; padding:28px; display:inline-block;">' +
                  '<img src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=' + encodeURIComponent('https://hchc.co.il') + '" style="width:350px; height:350px;" alt="QR">' +
                '</div>' +
                '<p style="margin-top:20px; font-size:1.8rem; font-weight:700; color:var(--gold-light);">hchc.co.il</p>' +
              '</div>';
            db.ref('eventIndex').on('child_added', function(childSnap) {
              window.location.href = 'screen.html?event=' + childSnap.key;
            });
          }
        });
      });
    });

  </script>
</body>
</html>
